limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=evaluation_limit:10m rate=1r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    client_body_timeout 30s;
    send_timeout 90s;

    # 受保护接口由后端继续校验 JWT/权限，Nginx 只负责按来源地址削峰。
    location ~ ^/api/v1/auth/login/?$ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location ~ ^/api/v1/kb/[0-9]+/documents/?$ {
        limit_req zone=upload_limit burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location ~ ^/api/v1/chat/?$ {
        limit_req zone=chat_limit burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /api/v1/chat/stream {
        limit_req zone=chat_limit burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 90s;
    }

    location ~ ^/api/v1/eval/ {
        limit_req zone=evaluation_limit burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
