x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragkb}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./app/db/ragkb_init.sql:/docker-entrypoint-initdb.d/10-ragkb-init.sql:ro
    networks:
      - app
    shm_size: 64mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 96m
    cpus: "0.25"
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 15
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    logging: *default-logging

  rag-kb-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-rag-kb-backend:shared}
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_METRICS: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      SERVER_LIMIT_CONCURRENCY: "20"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragkb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragkb}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragkb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragkb}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app
      - edge
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: "0.75"
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      [
        "--config.file=/etc/prometheus/prometheus.shared.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=7d",
        "--storage.tsdb.retention.size=256MB",
      ]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app
    depends_on:
      rag-kb-backend:
        condition: service_healthy
    mem_limit: 192m
    cpus: "0.25"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app
    depends_on:
      - prometheus
    mem_limit: 192m
    cpus: "0.25"
    restart: unless-stopped
    logging: *default-logging

networks:
  app:
    driver: bridge
  edge:
    external: true
    name: sales-agent_app

volumes:
  db-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
