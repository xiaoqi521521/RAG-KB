limit_req_zone $binary_remote_addr zone=ragkb_login_limit:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ragkb_upload_limit:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=ragkb_chat_limit:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ragkb_eval_limit:1m rate=1r/m;

server {
    listen 80;
    server_name zhimai.shaoji.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name zhimai.shaoji.site;

    ssl_certificate /etc/letsencrypt/live/zhimai.shaoji.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhimai.shaoji.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RAGKB_SSL:2m;
    ssl_session_timeout 1d;

    root /var/www/rag-kb;
    index index.html;
    client_max_body_size 100m;
    client_body_timeout 30s;
    send_timeout 90s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~ ^/api/v1/auth/login/?$ {
        limit_req zone=ragkb_login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/kb/[0-9]+/documents/?$ {
        limit_req zone=ragkb_upload_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/chat/?$ {
        limit_req zone=ragkb_chat_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/chat/stream {
        limit_req zone=ragkb_chat_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ~ ^/api/v1/eval/ {
        limit_req zone=ragkb_eval_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://rag-kb-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
