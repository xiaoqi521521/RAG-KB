# 单机 IP 部署：服务名以仓库根目录为基准，故所有相对路径统一加 ../../..。
# 在仓库根目录运行：
#   docker compose --env-file .env.compose -f deploy/ip/rag-kb/compose.yaml up -d
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragkb}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - ../../../data/postgres:/var/lib/postgresql/data
      - ../../../app/db/ragkb_init.sql:/docker-entrypoint-initdb.d/10-ragkb-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - ../../../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - ../../../data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging: *default-logging

  rag-kb-backend:
    image: ${BACKEND_IMAGE:-rag-kb-backend:shared}
    env_file:
      - /opt/shaoji-ip/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_METRICS: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      SERVER_LIMIT_CONCURRENCY: "20"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragkb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragkb}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragkb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragkb}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: nginx:1.27.5-alpine
    container_name: rag-kb-web
    depends_on:
      rag-kb-backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - /opt/shaoji-ip/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/rag-kb-ip.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-params.conf:/etc/nginx/snippets/proxy-params.conf:ro
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=7d",
        "--storage.tsdb.retention.size=256MB",
      ]
    volumes:
      - ../../../deploy/prometheus:/etc/prometheus:ro
      - ../../../data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      rag-kb-backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ../../../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../../../data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
