services:
  resume-agent:
    image: sales-agent-resume-agent:latest
    container_name: resume-agent
    env_file:
      - ./resume-agent/resume-agent.env
    volumes:
      - ./data/resume-metrics:/var/lib/resume-agent
    expose:
      - "8001"
    restart: unless-stopped

  web:
    image: nginx:1.27.5-alpine
    container_name: resume-web
    depends_on:
      - resume-agent
    ports:
      - "8080:80"
    volumes:
      - ./resume-agent/web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rate-limit.conf:/etc/nginx/conf.d/resume-agent-rate-limit.conf:ro
    restart: unless-stopped
