server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 8k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'self'; frame-src 'self' blob:; base-uri 'none'; frame-ancestors 'self'" always;

    location = /api/chat {
        limit_req zone=resume_agent_chat burst=5 nodelay;
        error_page 429 = @resume_agent_rate_limited;
        limit_except POST { deny all; }
        proxy_pass http://resume-agent:8001/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    location @resume_agent_rate_limited {
        internal;
        rewrite ^ /internal/metrics/nginx-rate-limited break;
        proxy_pass http://resume-agent:8001;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Resume-Agent-Metric-Source nginx-rate-limit;
    }

    location = /api/health {
        proxy_pass http://resume-agent:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/admin/metrics {
        limit_except GET { deny all; }
        proxy_pass http://resume-agent:8001/admin/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache off;
    }

    location = /resume {
        default_type application/pdf;
    }

    location = /resume.pdf {
        return 301 /resume;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
